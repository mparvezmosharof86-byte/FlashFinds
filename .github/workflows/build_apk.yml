name: Build & Release FlashFinds APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Native Android Project if missing
        run: |
          if [ ! -d "android/app/src" ]; then
            flutter create --org com.novastudio24 --project-name flashfinds .
          fi

      - name: Inject Real Firebase Keys into Dart
        run: |
          python3 -c "
          import json
          with open('android/app/google-services.json') as f:
              data = json.load(f)
          project_id = data['project_info']['project_id']
          storage_bucket = data['project_info'].get('storage_bucket', f'{project_id}.appspot.com')
          sender_id = data['project_info']['project_number']
          client = data['client'][0]
          api_key = client['api_key'][0]['current_key']
          app_id = client['client_info']['mobilesdk_app_id']

          code = f'''import \"package:firebase_core/firebase_core.dart\" show FirebaseOptions;

          class DefaultFirebaseOptions {{
            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: \"{api_key}\",
              appId: \"{app_id}\",
              messagingSenderId: \"{sender_id}\",
              projectId: \"{project_id}\",
              storageBucket: \"{storage_bucket}\",
            );
          }}
          '''
          with open('lib/firebase_options.dart', 'w') as out:
              out.write(code)
          print('Successfully injected real Firebase credentials into Dart!')
          "

      - name: Setup Permanent Keystore and Extract SHA-1
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml || true
          
          mkdir -p ~/.android
          mkdir -p android/app

          # Create permanent keystore if not exists
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FlashFinds,O=NovaStudio24,C=BD"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f android/app/debug.keystore || true
            git commit -m "Add permanent debug keystore [skip ci]" || true
            git push origin main || true
          fi

          cp android/app/debug.keystore ~/.android/debug.keystore

          # Extract Exact SHA-1
          ACTUAL_SHA1=$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | grep "SHA1:" | head -n 1 | awk '{print $2}')
          echo "ACTUAL_SHA1=$ACTUAL_SHA1" >> $GITHUB_ENV
          echo "Your real SHA-1 is: $ACTUAL_SHA1"

      - name: Install Flutter Packages
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Rename APK for Easy Download
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/FlashFinds.apk

      - name: Publish Direct APK Release with SHA-1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FlashFinds v1.0.${{ github.run_number }} - Direct APK"
          body: |
            ### 🔑 আপনার Firebase-এ বসানোর আসল SHA-1 কোড:
            `${{ env.ACTUAL_SHA1 }}`
            
            👉 Firebase Console > Project Settings > Add Fingerprint-এ গিয়ে এই কোডটি পেস্ট করুন।
          files: build/app/outputs/flutter-apk/FlashFinds.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
