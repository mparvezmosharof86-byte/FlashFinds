name: Build & Release FlashFinds APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Native Android Project if missing
        run: |
          if [ ! -d "android/app/src" ]; then
            flutter create --org com.novastudio24 --project-name flashfinds .
          fi

      - name: Install Flutter Packages
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Easy Download
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/FlashFinds.apk

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FlashFinds v1.0.${{ github.run_number }} - Direct APK"
          body: "FlashFinds-এর টেস্ট রিলিজ এপিকে। নিচে ক্লিক করে সরাসরি APK ডাউনলোড করুন।"
          files: build/app/outputs/flutter-apk/FlashFinds.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
