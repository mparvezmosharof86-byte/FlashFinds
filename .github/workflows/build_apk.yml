name: Build & Release FlashFinds APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Native Android Project if missing
        run: |
          if [ ! -d "android/app/src" ]; then
            flutter create --org com.novastudio24 --project-name flashfinds .
          fi

      - name: Inject Real Firebase Keys & Web Client ID
        run: |
          python3 -c "
          import json
          with open('android/app/google-services.json') as f:
              data = json.load(f)
          project_id = data['project_info']['project_id']
          storage_bucket = data['project_info'].get('storage_bucket', f'{project_id}.appspot.com')
          sender_id = data['project_info']['project_number']
          client = data['client'][0]
          api_key = client['api_key'][0]['current_key']
          app_id = client['client_info']['mobilesdk_app_id']

          # Extract Web Client ID for Google Login
          web_client_id = ''
          for c in data.get('client', []):
              for oc in c.get('oauth_client', []):
                  if oc.get('client_type') == 3:
                      web_client_id = oc.get('client_id', '')
                      break

          code = f'''import \"package:firebase_core/firebase_core.dart\" show FirebaseOptions;

          class DefaultFirebaseOptions {{
            static const String webClientId = \"{web_client_id}\";

            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: \"{api_key}\",
              appId: \"{app_id}\",
              messagingSenderId: \"{sender_id}\",
              projectId: \"{project_id}\",
              storageBucket: \"{storage_bucket}\",
            );
          }}
          '''
          with open('lib/firebase_options.dart', 'w') as out:
              out.write(code)
          print('Successfully injected Firebase credentials!')
          "

      - name: Strictly Lock Permanent Keystore & Read Real SHA-1
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml || true
          
          mkdir -p ~/.android
          # গিটহাবের সেই স্থায়ী ফাইলটি সরাসরি অ্যান্ড্রয়েডের সাইনিং ফোল্ডারে কপি করা হলো
          cp android/app/debug.keystore ~/.android/debug.keystore

          # এই আসল স্থায়ী ফাইলের আসল SHA-1 বের করা হলো
          PERMANENT_SHA1=$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | grep "SHA1:" | head -n 1 | awk '{print $2}')
          echo "PERMANENT_SHA1=$PERMANENT_SHA1" >> $GITHUB_ENV
          echo "### 🔑 THIS IS YOUR PERMANENT SHA-1: $PERMANENT_SHA1" >> $GITHUB_STEP_SUMMARY

      - name: Install Flutter Packages
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Rename APK for Easy Download
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/FlashFinds.apk

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FlashFinds v1.0.${{ github.run_number }} - Locked Keystore"
          body: |
            ### 🔑 আপনার এই পার্মানেন্ট চাবির আসল SHA-1 কোড:
            `${{ env.PERMANENT_SHA1 }}`
            
            👉 এই কোডটি কপি করে Firebase Console > Project Settings > Add Fingerprint-এ বসিয়ে দিন।
          files: build/app/outputs/flutter-apk/FlashFinds.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
